     ★ 要改人/学号/宿舍号,只改下面的 DORMS 数据即可。 -->
<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>齐鲁工业大学宿舍改造系统</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a}
  .page{max-width:480px;margin:0 auto;min-height:100vh;background:#fff}
  .header{background:#2b7de9;display:flex;align-items:center;gap:16px;padding:20px 22px}
  .logo{width:58px;height:58px;border-radius:50%;background:#fff;overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;justify-content:center}
  .logo img{width:100%;height:100%;object-fit:cover}
  .header h1{margin:0;color:#fff;font-size:25px;font-weight:700;letter-spacing:1px}
  .content{padding:24px 18px 40px}
  .info-table{width:100%;border:1px solid #e3e6eb;border-radius:10px;overflow:hidden;margin-bottom:22px}
  .info-row{display:flex}.info-row+.info-row{border-top:1px solid #e3e6eb}
  .info-key{flex:0 0 38%;background:#f6f7f9;padding:20px 0;text-align:center;font-size:20px;border-right:1px solid #e3e6eb}
  .info-val{flex:1;padding:20px 22px;display:flex;align-items:center;font-size:20px}
  .bed-table{width:100%;border:1px solid #e3e6eb;border-radius:10px;overflow:hidden}
  .bed-head{display:flex;background:#dce9fb;font-weight:700;font-size:20px}
  .bed-head .c1,.bed-row .c1{flex:0 0 40%;text-align:center;border-right:1px solid #e3e6eb}
  .bed-head .c2,.bed-row .c2{flex:1;text-align:center}
  .bed-head .c1,.bed-head .c2{padding:18px 0}
  .bed-row{display:flex;border-top:1px solid #e3e6eb;font-size:20px}
  .bed-row .c1,.bed-row .c2{padding:20px 0}
  .bed-row.me{background:#fff7e0}
  .back-btn{display:block;margin:30px auto 0;background:#2b7de9;color:#fff;border:none;border-radius:8px;
    padding:15px 56px;font-size:19px;text-decoration:none;text-align:center;width:max-content;font-family:inherit;cursor:pointer}
  .notfound{padding:60px 24px;text-align:center;color:#666;font-size:18px}
</style>
